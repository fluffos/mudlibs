  "description": "光緒二十一年夏，台灣割讓的噩耗傳來。\n詩人林會堂在十宜樓上喝乾了最後一壺酒，悲憤之下，用防身小刀在窗櫺木欄上刻下了『山河已改，此心難移』的狂草。\n刀尖入木三分，木屑混合著他的眼淚落在地板上。\n",
