<H1>
<FONT COLOR="#FF99FF">全域引用檔案 (global include file)</FONT></H1></CENTER>

<CENTER>
<HR WIDTH="100%"></CENTER>


<P><FONT COLOR="#CCFFFF">在組態檔案 (config file) 中, 可能會有一個選項為
Global include file (暫譯為: 全域引用檔案). 如果有此定義, 則定義的檔案將自動引入所有檔案的開頭中,
如同所有的檔案開端都有 #include 將此檔案引入.</FONT>

<P><FONT COLOR="#CCFFFF">如果有一些定義通用於所有的物件, 此為一個有用的方法.</FONT>

<P>
