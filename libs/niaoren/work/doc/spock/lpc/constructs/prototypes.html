<CENTER>
<HR WIDTH="100%"></CENTER>

<CENTER><FONT COLOR="#FFFFCC">* 函式的原型 (prototype):</FONT></CENTER>

<HR WIDTH="100%">
<BR>LPC 的函式原型與 ANSI C 非常相似. 函式原型可以做較好的型態檢查, 並當作一種「前宣告」
('forward' declaration).

<P><FONT COLOR="#FFCC99">傳回值形態 函式名稱( 第一個參數型態 參數一, 第二個參數形態
參數二, ... );</FONT>

<P>上面的函式在函式原型中, 參數不需要給名稱:

<P><FONT COLOR="#FFCC99">傳回值形態 函式名稱( 參數一, 參數二, ... );</FONT>
