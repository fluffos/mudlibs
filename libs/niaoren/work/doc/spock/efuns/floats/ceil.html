<CENTER><FONT COLOR="#FF99FF"><FONT SIZE=+3>ceil(3)　　 MudOS v21c2　 (5
Sep 1994)</FONT></FONT></CENTER>

<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 ceil() - 把一個浮點數進位成最近的整數值.</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 float ceil( float f );

<P>　 浮點數 ceil( 浮點數 f );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 傳回一個最接近 f　 而且等於或大於 f　 的整數浮點數, 即 f　 的小數位都無條件進位成整數.</UL>
