<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 exp() - 以一個浮點數為指數, 自然對數 e　 為底數計算其值.</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 float exp( float f );

<P>　 浮點數 exp( 浮點數 f );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 exp() 傳回 e^f 的值.</UL>
