<CENTER><FONT COLOR="#FF99FF"><FONT SIZE=+3>sqrt(3)　　 MudOS v21c2　 (5 Sep
1994)</FONT></FONT></CENTER>

<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 sqrt() - 傳回一個浮點數的平方根 (square root).</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 float sqrt( float f );

<P>　 浮點數 sqrt( 浮點數 f );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 sqrt() 傳回參數 f　 的正平方根. f 不可為負.</UL>
