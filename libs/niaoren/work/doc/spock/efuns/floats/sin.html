<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 sin() - 傳回一個浮點數的正弦值 (sine).</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 float sin( float f );

<P>　 浮點數 sin( 浮點數 f );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 傳回參數的正弦值. f 的單位是弳度 (radians).</UL>
