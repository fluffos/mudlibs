<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 log() - 傳回一個浮點數的自然對數</UL>

<UL>　 float log( float f );

<P>　 浮點數 log( 浮點數 f );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 傳回參數 f　 的自然對數. f 必須為正值.</UL>
