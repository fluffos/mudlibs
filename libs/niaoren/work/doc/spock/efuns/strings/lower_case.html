<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 lower_case() - 轉換一個指定字串的內容為小寫</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 string lower_case( string str );

<P>　 字串 lower_case( 字串 str );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 傳回一個指定字串的小寫樣式 (原來的字串不會變更) .</UL>
