1994)</FONT></FONT></CENTER>

<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 rmdir() - 刪除一個目錄.</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 int rmdir( string dir );

<P>　 整數 rmdir( 字串 dir );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 刪除 dir 這個目錄.</UL>
<FONT COLOR="#FFFFCC">　傳回值:</FONT>
<UL>　 成功就傳回非零值 (nonzero), 失敗則傳回 0.</UL>
