<CENTER><FONT COLOR="#FF99FF"><FONT SIZE=+3>flag(4)　　 MudOS v21c2　 (5
Sep 1994)</FONT></FONT></CENTER>

<HR WIDTH="100%"><FONT COLOR="#FFFFCC">　名稱:</FONT>
<UL>　 flag - 當驅動程式啟動時, 處理 mudlib 所指定的特定旗標 (flag).</UL>
<FONT COLOR="#FFFFCC">　語法:</FONT>
<UL>　 void flag( string );

<P>　 無傳回值 flag( 字串 );</UL>
<FONT COLOR="#FFFFCC">　用法:</FONT>
<UL>　 驅動程式啟動時, 如果在作業系統的命令列下指定 -f 選項, 每一個其他的命令列選項都會當作
flag() 的參數呼叫它.</UL>

<UL>　 Spock @ FF 97.Aug.6.　 (printed 3/16/95)</UL>
