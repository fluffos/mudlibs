<H1>
<FONT COLOR="#FF99FF"><FONT SIZE=+3>__INIT(4)　 MudOS v21c2　 (5 Sep 1994)</FONT></FONT></H1></CENTER>

<HR WIDTH="100%">
<BR><FONT COLOR="#FFFFCC">名稱:</FONT>
<UL>__INIT - 此函式已經作廢.</UL>
<FONT COLOR="#FFFFCC">語法:</FONT>
<UL>__INIT( void );

<P>__INIT( 無參數 );</UL>
<FONT COLOR="#FFFFCC">用法:</FONT>
<UL>以前物件在創造 (create) 之前呼叫此函式. 初始化 (initialization)　 全域變數的工作目前由其他的函式取代,
而再也無法插手干預初始化的過程. 因此 __INIT 函式已經作廢.</UL>
<FONT COLOR="#FFFFCC">翻譯:</FONT>
<UL>Spock @ FF 97.Aug.3.　 (printed 3/16/95)</UL>
