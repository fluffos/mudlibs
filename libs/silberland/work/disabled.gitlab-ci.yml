stages:
  - build

build-job:
  stage: build
  image: ubuntu:23.10
  script:
    - apt-get update
    - apt-get -y install git ftp
    - git diff --name-only HEAD HEAD~1 | grep -v "secure/.*" > changed_file.txt
    - echo -------- Changed Files --------
    - cat changed_file.txt
    - echo -------------------------------
