# Build & deploy the playable-in-browser mudlib site to GitHub Pages.
#
# Pipeline (each push of a lib -> a playable static website):
#   1. Download the latest prebuilt WASM driver (fluffos-<ver>-wasm.zip) from
#      fluffos/fluffos releases: fluffos.js/fluffos.wasm + the web terminal
#      (index.html, telnet.js, vendor/xterm).
#   2. scripts/build_site.sh packs every lib in libs/<slug>/ into a browser
#      bundle (scripts/pack_lib_for_web.sh: trimmed tree -> mudlib.data/.js
#      via emscripten's file_packager, config rewritten to the in-memory
#      mount, per-lib page patched to load the driver from ONE shared copy
#      at site/_driver/ instead of duplicating ~3.5MB x 90 libs).
#   3. scripts/gen_site_index.py renders the index (game names, admin
#      credentials from each lib's README.md, playable/limited/noboot
#      status derived from the checked-in scripts/wasm_status.json status
#      mapping, per-lib last-changed commit links from lib-commits.json --
#      maintained by scripts/update_lib_commits.py via the GitHub commits
#      API, because this shallow clone has no history to derive it from).
#   4. scripts/make_source_zips.sh re-zips just the libs build_site.sh
#      repacked this run (its repacked_slugs output -- same "changed
#      since last publish, or no valid cache" set the WASM step used) and
#      uploads them to the "source-zips" GitHub Release, so each site
#      card's "Download ZIP" link always points at a current archive
#      without re-zipping all 192 libs every run.
#   5. Upload site/ as the Pages artifact and deploy.
#      (There is deliberately no boot smoke test here anymore -- it kept
#      failing CI on real, but slow/flaky-under-node-timeout, per-lib boot
#      issues that don't reflect the actual browser deploy. Bad bundles
#      are now caught by the deep functional test pass (AGENTS.md §10.7)
#      instead, run by hand against the native driver before a lib is
#      committed.)
#
# INCREMENTAL packing -- two mechanisms with distinct roles:
#
# CORRECTNESS: the `pages-state` orphan branch holds one file,
# last-published-sha -- the commit the LIVE site was last successfully
# deployed from.  It is read at the start of every build (empty on
# bootstrap -> full repack) and advanced ONLY after the deploy job actually
# succeeds, so it always reflects reality.  build_site.sh repacks exactly
# the libs whose tree differs between that sha and HEAD.  This matters
# because cancel-in-progress (below) means that during a burst of pushes
# most runs die mid-build leaving no trace; whichever run finally survives
# still computes the full cumulative diff against the live site's true
# state, because that state lives in durable git history -- not in an
# evictable cache blob.  (It also answers "what commit is the live site
# built from?": `git show origin/pages-state:last-published-sha`.)
# The pages-state branch is not in this workflow's push branch filter, so
# advancing the marker never re-triggers the pipeline.
#
# SPEED: the packed bundles persist in ONE actions/cache entry (see
# build_site.sh's manifest: driver tag + packer blob sha + per-lib tree
# hashes recording what each cached bundle was packed FROM).  A lib
# unchanged since last publish whose cached bundle provenance matches
# HEAD's tree + the current driver/packer is reused instead of repacked.
# The cache key embeds the commit sha so every run with changes saves a
# fresh snapshot; restore-keys fall back to the newest previous entry.
# GitHub's cache is 10GB/repo with LRU eviction -- the ~2GB packed site
# fits; a cache miss (eviction/expiry) just means one slow full repack,
# never a wrong site: the marker alone decides what MUST be repacked.
# The deploy itself is always full-site: actions/deploy-pages replaces the
# site atomically, so only the packing step can be (and is) incremental.
#
# Trigger note: push is filtered to the paths that actually change the site
# (lib content, scripts, this workflow) so unrelated
# pushes (archive blobs, top-level docs) don't burn 30+ CI minutes.

name: Deploy mudlib site to Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'libs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy pipeline at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The repo carries ~4GB of history (original archives); a shallow
      # clone is mandatory.  HEAD's tree objects are enough for the
      # per-lib `git rev-parse HEAD:libs/<slug>` tree hashes; the
      # last-published base commit is fetched separately below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Read the durable "what is live right now" marker (see header).
      # The base commit is fetched with --filter=blob:none: tree-hash
      # comparison needs its commit + tree objects only, so the shallow
      # clone stays small (no second ~2.4GB blob download).  Any failure
      # (no branch yet / marker sha unreachable, e.g. after a history
      # rewrite) degrades to sha="" -> build_site.sh does a full repack.
      - name: Read last-published marker (pages-state branch)
        id: marker
        run: |
          set -euo pipefail
          base=""
          if git fetch --quiet --depth=1 origin pages-state 2>/dev/null; then
            base=$(git show FETCH_HEAD:last-published-sha 2>/dev/null || true)
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "no usable pages-state marker; full repack (bootstrap)"
            base=""
          elif git fetch --quiet --depth=1 --filter=blob:none origin "$base" \
                 2>/dev/null \
               && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "live site was last published from $base"
          else
            echo "::warning::last-published sha $base is not fetchable;" \
                 "falling back to a full repack"
            base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Fetch latest prebuilt WASM driver release
        id: driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo fluffos/fluffos --json tagName -q .tagName)
          echo "latest fluffos release: $tag"
          gh release download "$tag" --repo fluffos/fluffos \
              --pattern '*-wasm.zip' --dir "$RUNNER_TEMP/wasm-release" \
            || { echo "::error::release $tag has no *-wasm.zip asset (the pipeline needs the prebuilt WASM driver)"; exit 1; }
          zip=$(ls "$RUNNER_TEMP"/wasm-release/*-wasm.zip | head -1)
          unzip -q "$zip" -d "$RUNNER_TEMP/wasm-release/rel"
          for f in fluffos.js fluffos.wasm index.html telnet.js pack-mudlib.sh; do
            [ -f "$RUNNER_TEMP/wasm-release/rel/$f" ] \
              || { echo "::error::release zip is missing $f"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only emscripten's file_packager is needed (no compile), so any
      # recent emsdk works; 'latest' keeps it maintenance-free.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Restore packed-lib cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/packed-cache
          key: packed-site-v1-${{ steps.driver.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            packed-site-v1-${{ steps.driver.outputs.tag }}-
            packed-site-v1-

      - name: Build site (incremental repack + index)
        id: build
        env:
          LAST_PUBLISHED_SHA: ${{ steps.marker.outputs.sha }}
          # for update_lib_commits.py's GitHub commits API queries
          # (per-lib last-changed info on the index cards)
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build_site.sh "$RUNNER_TEMP/wasm-release/rel" \
              "${{ steps.driver.outputs.tag }}" \
              "$RUNNER_TEMP/packed-cache" site

      - name: Save packed-lib cache
        if: steps.build.outputs.changed != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/packed-cache
          key: packed-site-v1-${{ steps.driver.outputs.tag }}-${{ github.sha }}

      # Per-lib downloadable source ZIPs (scripts/make_source_zips.sh),
      # hosted as assets on the "source-zips" GitHub Release rather than
      # in the Pages deploy itself -- the full set is ~2.3GB, which would
      # roughly double the ~2GB WASM site if bundled in (see that
      # script's header). Reuses build_site.sh's own repacked_slugs
      # output (the libs whose tree changed since last publish, or
      # lacked a valid cached bundle) as the "needs a fresh zip" list,
      # so there's no separate change-detection to maintain. Empty list
      # (nothing changed) skips the step entirely -- most runs.
      #
      # Known gap: this does not prune assets for libs that are removed
      # or renamed (rare -- see AGENTS.md's numbering-duplicate process);
      # a stale zip left behind is a minor blemish, not a correctness
      # bug, and cleaning it up by hand (`gh release delete-asset`) is
      # fine when it happens.
      - name: Refresh changed libs' source ZIPs on the source-zips release
        if: steps.build.outputs.repacked_slugs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/source-zips"
          mkdir -p "$out"
          scripts/make_source_zips.sh "$out" ${{ steps.build.outputs.repacked_slugs }}
          gh release view source-zips --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create source-zips --repo "$GITHUB_REPOSITORY" \
                 --title "Per-lib source archives" \
                 --notes "One downloadable ZIP per mudlib in this collection -- the trimmed source tree (LPC/header source, config.fluffos, README/NOTES/meta.json, seeded save data), no need to clone the full repository. Auto-generated by scripts/make_source_zips.sh on every relevant push; linked from each game's card at https://mudlibs.fluffos.info/ and from games.json."
          gh release upload source-zips "$out"/*.zip --repo "$GITHUB_REPOSITORY" --clobber

      # enablement: true lets the very first run switch the repo's Pages
      # source to "GitHub Actions" itself.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # contents: write is for advancing the pages-state marker branch after
    # a successful deploy (job-level block overrides the top-level one).
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The site is now actually live: durably record which commit it was
      # built from.  Runs ONLY when deploy-pages succeeded (default step
      # `if: success()`), so the marker can never claim something shipped
      # that didn't.  Done in a scratch repo (no checkout: main's tree is
      # ~2.4GB; the pages-state branch is one tiny file).  Pushing
      # pages-state cannot re-trigger this workflow: the push trigger only
      # watches main/master.  Runs of this workflow are serialized by the
      # concurrency group, so competing marker pushes cannot race.
      - name: Advance last-published marker (pages-state branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pages-state"
          git init --quiet "$dir"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth=1 origin pages-state 2>/dev/null; then
            git checkout --quiet -b pages-state FETCH_HEAD
          else
            # first publish ever: bootstrap the orphan branch
            git checkout --quiet --orphan pages-state
          fi
          echo "$GITHUB_SHA" > last-published-sha
          git add last-published-sha
          if git diff --quiet --cached HEAD -- 2>/dev/null; then
            echo "marker already at $GITHUB_SHA (re-run); nothing to push"
            exit 0
          fi
          git commit --quiet \
              -m "publish $GITHUB_SHA (run $GITHUB_RUN_ID, $GITHUB_WORKFLOW)"
          git push --quiet origin pages-state
          echo "pages-state advanced to $GITHUB_SHA"
